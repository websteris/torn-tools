# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # sqlite3@6 requires node >=20.17.0, so 18.x is an unsupported config.
        # 20.x/22.x both resolve to a release above that floor (see package.json
        # engines). Node 18 is EOL. See https://nodejs.org/en/about/releases/
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - name: Generate secret-free test config
      run: |
        cat > config/test-config.js <<'EOF'
        module.exports = {
          apiKeys: {
            test: process.env.TORN_API_KEY || null,
            publicOnly: process.env.TORN_API_KEY || null,
            higherAccess: process.env.TORN_API_KEY_HIGHER || null
          },
          testUser: { id: 1, name: 'test-user', torn_id: 1, faction_id: 0, faction_name: 'Test Faction' }
        };
        EOF
    - name: Run tests
      env:
        TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
      run: npm test
